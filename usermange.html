<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>User Application</title>
</head>

<body>

    <!-- Nav Bar -->
    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-md">
            <a class="navbar-brand text-light" href="#">User-App</a>
            <button class="btn text-light border-0 p-0" data-bs-toggle="modal" data-bs-target="#modal-3">
                <i class="bi bi-person-fill-gear" style="font-size: 30px;" onclick="setUerDataRefreshTocken()"></i>
            </button>
        </div>
    </nav>
    <!-- Nav Bar -->

    <!-- Btn & Searching Section -->
    <div class="container mt-5">
        <div class="row">
            <div class="row d-flex justify-content-start align-items-center mb-4">
                <div class="col-2">
                    <input type="text" class="form-control" id="st_input" placeholder="Search Text">
                </div>
                <div class="col-2">
                    <input type="text" class="form-control" id="pn_input" placeholder="Page Number">
                </div>
                <div class="col-2">
                    <input type="text" class="form-control" id="ps_input" placeholder="Page Size">
                </div>
                <div class="col-1">
                    <input type="button" class="btn btn-outline-primary" value="SEARCH" onclick="searchOnClick()">
                </div>
                <div class="col-1">
                    <input type="button" class="btn btn-outline-warning" data-bs-toggle="modal"
                        data-bs-target="#modal-2" value="UPDATE">
                </div>
                <div class="col-2">
                    <!-- Button trigger modal -->
                    <input type="button" class="btn btn-outline-secondary col-12" data-bs-toggle="modal"
                        data-bs-target="#modal-1" value="New User">
                    <!-- Button trigger modal -->
                </div>
            </div>
        </div>

        <div class="row">
            <!-- User Table Section -->
            <div class="container d-flex justify-content-start align-items-center">
                <div class="table-responsive" style="height: 500px; width: 1200px;">
                    <table class="table table-hover" id="userTableLoading"></table>
                </div>
            </div>
            <!-- User Table Section -->

            <!-- Modal -->
            <div class="modal fade" id="modal-1" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">New User</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="p-5">
                                <div class="row">
                                    <div class="col-4">
                                        <label for="exampleInputEmail1" class="form-label">User ID</label>
                                        <input type="text" class="form-control" id="u_id" placeholder="1001">
                                    </div>
                                    <div class="col-8">
                                        <label for="exampleInputEmail1" class="form-label">E-mail</label>
                                        <input type="email" class="form-control" id="u_email"
                                            placeholder="example@gmail.com">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12">
                                        <label for="exampleInputEmail1" class="form-label">Full Name</label>
                                        <input type="text" class="form-control" id="u_fulln" placeholder="John Frank">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label for="exampleInputEmail1" class="form-label">Password</label>
                                    <input type="text" class="form-control" id="u_pw" placeholder="asd@3#^&25JK">
                                </div>
                                <div class="col-12 mt-4">
                                    <input type="button" class="btn btn-outline-secondary col-12"
                                        value="User Registrations" onclick="OnclickNewUser()">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary">Save changes</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Modal -->
        </div>
    </div>
    <!-- Btn & Searching Section -->

    <!-- Update Modale -->
    <div class="modal fade" id="modal-2" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Update Password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row d-flex justify-content-center align-items-center p-4">
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">User ID</label>
                            <input type="text" class="form-control" id="us_id" placeholder="1001">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Exits Password</label>
                            <input type="text" class="form-control" id="epw_id" placeholder="123@#$asdTHj4">
                        </div>
                        <div>
                            <label for="exampleInputEmail1" class="form-label">New Password</label>
                            <input type="text" class="form-control" id="npw_id" placeholder="a$a@#$asdTHn4">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="updateOnClick()">Save changes</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Update Modale -->

    <!-- Refresh Token -->
    <div class="modal fade" id="modal-3" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-2" id="exampleModalLabel">Refresh Token</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="pe-3 ps-3">
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Token</label>
                            <input type="text" class="form-control" id="token_id"
                                placeholder="Ex:- WyYHrpSwHF0LXuHG83SDoN5BmJkssyut8bpYo/iqiPc=">
                        </div>
                        <div>
                            <label for="exampleInputEmail1" class="form-label">Refresh Token</label>
                            <input type="text" class="form-control" id="refresh_token_id"
                                placeholder="Ex:- WyYHrpSwHF0LXuHG83SDoN5BmJkssyut8bpYo/iqiPc=">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="onClickGenarateToken()">Genarate</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
