<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>User Application</title>
</head>

<body>

    <!-- Sign in Section -->
    <div class="container">
        <div class="row min-vh-100 d-flex justify-content-center align-items-center">
            <div class="col-4 card shadow-lg border-0 rounded-5 p-5">
                <div class="mb-3">
                    <h3 class="fw-semibold">Sign in Your Account.</h3>
                </div>
                <div class="mt-3">
                    <label for="exampleInputEmail1" class="form-label">E-mail</label>
                    <input type="email" class="form-control p-2" id="email" placeholder="example@gmail.com">
                </div>
                <div class="mt-3">
                    <label for="exampleInputEmail1" class="form-label">Password</label>
                    <input type="email" class="form-control p-2" id="password" placeholder="%kj!23@#dfDF">
                </div>
                <div class="text-end mt-2">
                    <input type="button" data-bs-target="#modal-1" data-bs-toggle="modal"
                        class="border-0 bg-body text-primary" value="Froget Password ?" style="font-size: 14px;">
                </div>
                <div class="mt-4">
                    <button type="button" class="btn btn-warning col-12 p-2">Login now</button>
                </div>
                <span class="text-center mt-3" style="font-size: 13px;">Don't Have An Account ?</span>
            </div>
        </div>
    </div>
    <!-- Sign in Section -->

    <!-- Modal Forget Password-->
    <div class="modal fade" id="modal-1" tabindex="-1" aria-labelledby="exampleModalToggleLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h1 class="modal-title fs-4 fw-semibold" id="exampleModalLabel">Reset Password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <span class="fw-semibold" style="font-size: 18px;">Enter email for verfication code.</span>
                    </div>
                    <div>
                        <label for="exampleInputEmail1" class="form-label">Email Address</label>
                        <input type="email" class="form-control p-2" id="email" placeholder="example@gmail.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" data-bs-target="#modal-2"
                        data-bs-toggle="modal">Conform</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Forget Password-->

    <!-- Model OTP SET -->
    <div class="modal fade" id="modal-2" tabindex="-1" aria-labelledby="exampleModalToggleLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h1 class="modal-title fs-4 fw-semibold" id="exampleModalLabel">Reset Password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <span class="fw-semibold" style="font-size: 20px;">Enter verfication code.</span>
                        <div class="mb-0">
                            <span style="font-size: 16px;">We've sent a code to.</span>
                        </div>
                    </div>
                    <div class="d-flex">
                        <div class="p-1">
                            <input type="text" class="form-control p-2 text-center fs-5" id="vc_1">
                        </div>
                        <div class="p-1">
                            <input type="text" class="form-control p-2 text-center fs-5" id="vc_2">
                        </div>
                        <div class="p-1">
                            <input type="text" class="form-control p-2 text-center fs-5" id="vc_3">
                        </div>
                        <div class="p-1">
                            <input type="text" class="form-control p-2 text-center fs-5" id="vc_4">
                        </div>
                        <div class="p-1">
                            <input type="text" class="form-control p-2 text-center fs-5" id="vc_5">
                        </div>
                        <div class="p-1">
                            <input type="text" class="form-control p-2 text-center fs-5" id="vc_6">
                        </div>
                    </div>

                    <div class="d-flex justify-content-center align-items-center">
                        <span style="font-size: 16px;">Didn't get a code ? <input type="button"
                                class="border-0 bg-body text-primary" value="Resend Code." style="font-size: 14px;"
                                onclick=""></span>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" data-bs-target="#modal-3"
                        data-bs-toggle="modal">Verify</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Model OTP SET -->

    <!-- Conform Password -->
    <div class="modal fade" id="modal-3" tabindex="-1" aria-labelledby="exampleModalToggleLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h1 class="modal-title fs-4 fw-semibold" id="exampleModalLabel">Create New Password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <span class="fw-semibold" style="font-size: 15px;">Enter your new password below to complete the
                            reset process.</span>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Password</label>
                        <input type="text" class="form-control p-2" id="n_pw" placeholder="12FgH@#8&*>?">
                    </div>
                    <div>
                        <label for="exampleInputEmail1" class="form-label">Conform Password</label>
                        <input type="password" class="form-control p-2" id="nc_pw" placeholder="12FgH@#8&*>?">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Conform</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Conform Password -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
