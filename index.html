<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>User Application</title>
</head>

<body>

    <div class="container">
        <div class="row min-vh-100 d-flex justify-content-center align-items-center">
            <div class="col-4 card shadow-lg border-0 rounded-5 p-5">
                <div class="mb-3">
                    <h3 class="fw-semibold">Sign in Your Account.</h3>
                </div>
                <div class="mt-3">
                    <label for="exampleInputEmail1" class="form-label">E-mail</label>
                    <input type="email" class="form-control p-2" id="email" placeholder="example@gmail.com">
                </div>
                <div class="mt-3">
                    <label for="exampleInputEmail1" class="form-label">Password</label>
                    <input type="email" class="form-control p-2" id="password" placeholder="%kj!23@#dfDF">
                </div>
                <div class="text-end mt-2">
                    <input type="button" data-bs-toggle="modal" data-bs-target="#exampleModal"
                        class="border-0 bg-body text-primary" value="Froget Password ?" style="font-size: 14px;">
                </div>
                <div class="mt-4">
                    <button type="button" class="btn btn-warning col-12 p-2">Login now</button>
                </div>
                <span class="text-center mt-3" style="font-size: 13px;">Don't Have An Account ?</span>
            </div>
        </div>
    </div>

    <!-- Modal Forget Password-->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h1 class="modal-title fs-4 fw-semibold" id="exampleModalLabel">Reset Password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <span class="fw-semibold" style="font-size: 18px;">Enter email for verfication code.</span>
                    </div>
                    <div>
                        <label for="exampleInputEmail1" class="form-label">Email Address</label>
                        <input type="email" class="form-control p-2" id="email" placeholder="example@gmail.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Conform</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Forget Password-->

    <!-- Model OTP SET -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h1 class="modal-title fs-4 fw-semibold" id="exampleModalLabel">Reset Password</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <span class="fw-semibold" style="font-size: 18px;">Enter email for verfication code.</span>
                    </div>
                    <div>
                        <label for="exampleInputEmail1" class="form-label">Email Address</label>
                        <input type="email" class="form-control p-2" id="email" placeholder="example@gmail.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary">Verify</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Model OTP SET -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
