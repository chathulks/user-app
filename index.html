<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>User Application</title>
</head>

<body>

    <div class="container">
        <div class="card border-0 shadow-lg p-5 col-3 rounded-4">
            <div class="row">
                <div class="col-12">
                    <div class="col-12">
                        <label for="exampleInputEmail1" class="form-label">User ID</label>
                        <input type="text" class="form-control" id="u_id">
                    </div>
                    <div class="col-12">
                        <label for="exampleInputEmail1" class="form-label">Username</label>
                        <input type="text" class="form-control" id="u_name">
                    </div>
                    <div class="col-12">
                        <label for="exampleInputEmail1" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="u_fn">
                    </div>
                    <div class="col-12">
                        <label for="exampleInputEmail1" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="u_ls">
                    </div>
                    <div class="col-12">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="u_em">
                    </div>
                    <div class="col-12">
                        <label for="exampleInputEmail1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="u_pw">
                    </div>
                    <div class="col-12 mt-4">
                        <input type="button" class="btn btn-outline-secondary col-12" value="User Registrations">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>

</html>
